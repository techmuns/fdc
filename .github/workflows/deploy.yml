name: Build & deploy to Cloudflare Pages

# Automated deployment. After the ONE-TIME setup below, every push to `main`
# rebuilds the dashboard and deploys it to Cloudflare Pages — no manual steps.
#
# ONE-TIME SETUP (do this once, then it is automatic forever):
#   1. Create a Cloudflare API token with the "Cloudflare Pages: Edit" permission
#      at https://dash.cloudflare.com/profile/api-tokens
#   2. In this GitHub repo: Settings → Secrets and variables → Actions → New secret
#        CLOUDFLARE_API_TOKEN   = <the token from step 1>
#        CLOUDFLARE_ACCOUNT_ID  = <your Cloudflare account id>
#   That's it. Pushes to main now deploy automatically.
#
# Until those two secrets exist the workflow still runs and validates the build,
# but skips the deploy step (so there is no failing check before you configure it).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Rebuild the clean JSON from the source SAP exports, then build the SPA.
      - run: npm run normalize
      - run: npm run build

      - name: Check Cloudflare credentials
        id: cfg
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets to enable automatic Cloudflare Pages deploys."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cfg.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=fdc-procurement-cockpit --branch=main
